[package]
name = "mail-dev"
version = "0.7.1"
description = "Mail Dev"
authors = ["Franck Hérold TAMTO TAMKO"]
license = "MIT"
repository = "https://github.com/STIFLEUR390/mail-dev"
default-run = "mail-dev"
edition = "2021"
build = "src/build.rs"

[lib]
name = "mail_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
mailin-embedded = { version = "^0", features = ["rtls"] }
mailparse = "0.13.8"
lettre = "0.10.1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
